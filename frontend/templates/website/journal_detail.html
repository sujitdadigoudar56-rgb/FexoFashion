{% extends "base.html" %}
{% block title %}{{ post.title }} — FEXO Journal{% endblock %}
{% block content %}
<div style="padding-top:150px;">
<div class="fx-container" style="max-width:760px;">
  <span class="fx-eyebrow">{{ post.author_name }} &middot; {{ post.created_at|date:"d M Y" }}</span>
  <h1 class="fx-serif" style="font-size:44px;margin:16px 0 30px;">{{ post.title }}</h1>
  {% if post.cover_image %}<img src="{{ post.cover_image.url }}" style="width:100%;margin-bottom:36px;" alt="{{ post.title }}">{% endif %}
  <div class="fx-muted" style="line-height:1.9;font-size:16px;">{{ post.content|linebreaks }}</div>
</div>
</div>
{% endblock %}
