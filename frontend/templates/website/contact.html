{% extends "base.html" %}
{% block title %}Contact — FEXO{% endblock %}
{% block content %}
<div class="fx-page-header"><div class="fx-container"><span class="fx-eyebrow">Get in Touch</span><h1 class="fx-serif">Contact Us</h1></div></div>
<div class="fx-section" style="padding-top:56px;">
  <div class="fx-container" style="max-width:600px;">
    <form method="post">
      {% csrf_token %}
      <label class="fx-form-label">Name</label>
      <input type="text" name="name" class="fx-input" required>
      <label class="fx-form-label">Email</label>
      <input type="email" name="email" class="fx-input" required>
      <label class="fx-form-label">Subject</label>
      <input type="text" name="subject" class="fx-input">
      <label class="fx-form-label">Message</label>
      <textarea name="message" class="fx-textarea" rows="5" required></textarea>
      <button type="submit" class="fx-btn fx-btn-solid">Send Message</button>
    </form>
  </div>
</div>
{% endblock %}
