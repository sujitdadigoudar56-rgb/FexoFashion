{% extends "base.html" %}
{% block content %}
<div class="fx-auth-wrap">
  <h1 class="fx-serif">Set New Password</h1>
  {% if validlink %}
  <form method="post">
    {% csrf_token %}
    <label class="fx-form-label">New Password</label>
    <input type="password" name="new_password1" class="fx-input" required>
    <label class="fx-form-label">Confirm New Password</label>
    <input type="password" name="new_password2" class="fx-input" required>
    <button type="submit" class="fx-btn fx-btn-solid fx-btn-block">Reset Password</button>
  </form>
  {% else %}
    <p class="fx-sub">This reset link is invalid or has expired.</p>
  {% endif %}
</div>
{% endblock %}
