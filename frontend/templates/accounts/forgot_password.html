{% extends "base.html" %}
{% block title %}Reset Password — FEXO{% endblock %}
{% block content %}
<div class="fx-auth-wrap">
  <h1 class="fx-serif">Forgot Password</h1>
  <p class="fx-sub">Enter your email and we'll send reset instructions.</p>
  <form method="post">
    {% csrf_token %}
    <label class="fx-form-label">Email</label>
    <input type="email" name="email" class="fx-input" required>
    <button type="submit" class="fx-btn fx-btn-solid fx-btn-block">Send Reset Link</button>
  </form>
  <p class="fx-auth-switch"><a href="{% url 'accounts:login' %}">Back to sign in</a></p>
</div>
{% endblock %}
