{% extends "base.html" %}
{% block title %}Order Confirmed — FEXO{% endblock %}
{% block content %}
<div class="fx-auth-wrap fx-center">
  <div class="fx-stars" style="font-size:34px;margin-bottom:20px;">&#10003;</div>
  <h1 class="fx-serif">Order Confirmed</h1>
  <p class="fx-sub">Order <strong>{{ order.order_number }}</strong> has been placed successfully. You'll pay
    &#8377;{{ order.grand_total }} via Cash on Delivery upon arrival.</p>
  <a href="{% url 'accounts:orders' %}" class="fx-btn fx-btn-solid">View My Orders</a>
</div>
{% endblock %}
